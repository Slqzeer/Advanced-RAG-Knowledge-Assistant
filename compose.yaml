services:
  rag-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      RAG_API_KEY: ${RAG_API_KEY:-}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_CACHE_PATH: data/processed/embeddings.sqlite
      EMBEDDING_BASE_URL: ${DOCKER_EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${DOCKER_EMBEDDING_API_KEY:-}
      EMBEDDING_PROVIDER_MODEL: ${DOCKER_EMBEDDING_PROVIDER_MODEL:-}
      GENERATION_MODEL: ${DOCKER_GENERATION_MODEL:-gpt-4o-mini}
      GENERATION_BASE_URL: ${DOCKER_GENERATION_BASE_URL:-}
      GENERATION_API_KEY: ${DOCKER_GENERATION_API_KEY:-}
    ports:
      - "127.0.0.1:${RAG_API_PORT:-8000}:8000"
    volumes:
      - rag_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_REST_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r status <&3 &&
          [[ "$$status" == *"200 OK"* ]]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.10.2
    restart: unless-stopped
    # A cache: nothing to persist, and volatile-lru evicts only keys with a TTL,
    # so the vector set (no TTL) is never evicted wholesale.
    command: >-
      redis-server --maxmemory 256mb --maxmemory-policy volatile-lru
      --save "" --appendonly no
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_storage:
  rag_data:
