[project]
name = "advanced-rag-knowledge-assistant"
version = "0.1.0"
description = "Assistant documentaire technique fondé sur une architecture RAG avancée."
requires-python = ">=3.12"
dependencies = [
    "cohere>=5,<6",
    "fastapi>=0.116,<1",
    "flashrank>=0.2,<1",
    # Never imported directly: pinned only because ragas 0.4.3 unconditionally
    # imports the removed `langchain_community.chat_models.vertexai` module in
    # ragas/llms/base.py, and langchain-community 0.4 dropped that module.
    # langchain-community<0.4 still ships it, so `import ragas` works. See
    # ragas issues #2745, #2753, #2995. Remove this pin once ragas stops
    # importing that module (or drops the unconditional Vertex AI import).
    "langchain-community>=0.3,<0.4",
    "openai>=2,<3",
    "pydantic-settings>=2.10,<3",
    "qdrant-client>=1.15,<2",
    "ragas>=0.4,<0.5",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pre-commit>=4.3,<5",
    "pytest>=8.4,<9",
    "ruff>=0.16,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
# Plans and specs are prose; their code blocks are sketches, not source.
extend-exclude = ["docs"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
    "requires_qdrant: needs a running Qdrant (docker compose up -d qdrant)",
    "requires_model: downloads and loads the FlashRank ONNX weights",
]
pythonpath = ["."]
testpaths = ["tests"]
